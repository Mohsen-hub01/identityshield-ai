services:
  backend:
    image: ghcr.io/mohsen-hub01/identityshield-ai-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /home/app/.cache/huggingface
      IDENTITYSHIELD_AUDIT_PATH: /app/storage/human_review_audit.jsonl
    volumes:
      - identityshield-storage:/app/storage
      - identityshield-model-cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: ghcr.io/mohsen-hub01/identityshield-ai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  identityshield-storage:
  identityshield-model-cache:
